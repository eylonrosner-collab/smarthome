name = "smarthome"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# Namespace id is not a secret. deploy.sh reuses this id when it is already set.
[[kv_namespaces]]
binding = "RULES"
id = "e6884d87a1a042c8ac3067723d93ef45"

[ai]
binding = "AI"

[vars]
TUYA_BASE = "https://openapi.tuyaeu.com"
ALLOWED_ORIGIN = "https://eylonrosner-collab.github.io"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

[triggers]
crons = ["*/5 * * * *"]
